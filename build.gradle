plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.17'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.mod_id
}

repositories {
	maven {
		name = 'OpenCollab'
		url = 'https://repo.opencollab.dev/main/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	implementation(project(':pandorical'))

	compileOnly "org.geysermc.geyser:api:${project.geyser_api_version}"
	compileOnly "org.geysermc.floodgate:api:${project.floodgate_api_version}"
}

// Fabric tests these predicates against the loader's *normalized* game version,
// not Mojang's id: 26.3-snapshot-10 is compared as 26.3-alpha.10. So a floor of
// ">=26.3" is false on every 26.3 snapshot, and writing the obvious thing makes
// the mod refuse to load on the version it was built for. Derived from the pin
// rather than written into the manifest, so the two cannot drift apart.
def mcFloor = project.minecraft_version
	.replaceFirst(/-snapshot-/, '-alpha.')
	.replaceFirst(/-pre-/, '-pre.')
	.replaceFirst(/-rc-/, '-rc.')
// The trailing dash is load-bearing: "<26.4" would still admit 26.4's snapshots,
// because a prerelease sorts below its own release.
def mcParts = mcFloor.tokenize('.-')
def minecraftDependency = ">=${mcFloor} <${mcParts[0]}.${(mcParts[1] as int) + 1}-"
// The +26.3 build tag is ignored in comparison; the floor is the number.
def fabricApiFloor = ">=" + project.fabric_version.replaceFirst(/\+.*$/, '')

// Minecraft's own block models, which a dedicated server doesn't have and the conversion to
// Bedrock reads as parents. Taken from the game jar at build time so that Mojang's files go into
// the built jar, as the game's own do, and never into this repository.
def vanillaModels = layout.buildDirectory.dir("generated/vanilla-models")
def extractVanillaModels = tasks.register('extractVanillaModels') {
	def jars = configurations.compileClasspath.incoming.files.filter { it.name.startsWith('minecraft-merged') }
	inputs.files(jars)
	outputs.dir(vanillaModels)
	doLast {
		def prefix = 'assets/minecraft/models/block/'
		def models = new TreeMap()
		jars.each { jar ->
			def zip = new java.util.zip.ZipFile(jar)
			zip.entries().each { entry ->
				if (!entry.name.startsWith(prefix) || !entry.name.endsWith('.json')) return
				def model = new groovy.json.JsonSlurper().parse(zip.getInputStream(entry))
				def kept = new TreeMap(model.subMap(['parent', 'textures', 'elements']))
				models['minecraft:block/' + entry.name.substring(prefix.length(), entry.name.length() - 5)] = kept
			}
			zip.close()
		}
		if (models.isEmpty()) throw new GradleException("No block models found in the Minecraft jar")
		def out = vanillaModels.get().file('pandorical-geyser/vanilla-block-models.json').asFile
		out.parentFile.mkdirs()
		out.text = groovy.json.JsonOutput.toJson(models)
	}
}
sourceSets.main.resources.srcDir(extractVanillaModels)

processResources {
	inputs.property "version", project.version
	inputs.property "minecraftDependency", minecraftDependency
	inputs.property "loaderVersion", project.loader_version
	inputs.property "fabricApiVersion", fabricApiFloor

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
		       "minecraftDependency": minecraftDependency,
		       "loaderVersion": project.loader_version,
		       "fabricApiVersion": fabricApiFloor
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
	// The readme rides in the jar beside the licence, so a server can show it in-game.
	from("README.md") {
		rename { "README_${project.base.archivesName.get()}.md" }
	}
}
